<div id="stage">

<script>
'use strict';
const $=id=>document.getElementById(id),TAU=Math.PI*2,MS=1024;
const clamp=(v,a,b)=>v<a?a:v>b?b:v,wrapA=a=>{a%=TAU;return a>Math.PI?a-TAU:a<-Math.PI?a+TAU:a};
let seed=20;const rnd=()=>{seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const hash=(x,y)=>{let h=Math.imul(x,374761393)+Math.imul(y,668265263)|0;h=Math.imul(h^h>>>13,1274126177);return(h^h>>>16)>>>0};
const mk=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c};
const hex=s=>[parseInt(s.slice(1,3),16),parseInt(s.slice(3,5),16),parseInt(s.slice(5,7),16)];
const pack=(r,g,b,a=255)=>(a<<24|b<<16|g<<8|r)>>>0;
const mix=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];

/* ================= TRACK ================= */
const HW=38,KERB=7,LAPS=3,SPC=4;
const CP=[[512,875],[740,875],[868,835],[912,720],[888,600],[915,460],[925,300],[880,170],[760,110],[650,160],[615,290],[590,390],[505,440],[415,395],[372,285],[325,165],[225,110],[120,170],[95,300],[140,430],[210,520],[165,630],[105,740],[150,840],[270,875]];
let GS=[],N,TX,TY,TA,NX,NY,KS,bumpers=[],solids=[],pads=[],GA,surf,mips=[],miniBase;
function buildTrack(){
  const m=CP.length,raw=[];
  for(let i=0;i<m;i++){const a=CP[(i+m-1)%m],b=CP[i],c=CP[(i+1)%m],d=CP[(i+2)%m];
    for(let s=0;s<40;s++){const t=s/40,t2=t*t,t3=t2*t;raw.push([.5*(2*b[0]+(c[0]-a[0])*t+(2*a[0]-5*b[0]+4*c[0]-d[0])*t2+(3*b[0]-a[0]-3*c[0]+d[0])*t3),.5*(2*b[1]+(c[1]-a[1])*t+(2*a[1]-5*b[1]+4*c[1]-d[1])*t2+(3*b[1]-a[1]-3*c[1]+d[1])*t3)])}}
  let L=0;const R=raw.length,seg=[];for(let i=0;i<R;i++){const p=raw[i],q=raw[(i+1)%R],l=Math.hypot(q[0]-p[0],q[1]-p[1]);seg.push(l);L+=l}
  N=Math.round(L/SPC);const st=L/N,px=[],py=[];let si=0,acc=0;
  for(let i=0;i<N;i++){const tgt=i*st;while(acc+seg[si]<tgt){acc+=seg[si];si++}const t=(tgt-acc)/seg[si],p=raw[si],q=raw[(si+1)%R];px.push(p[0]+(q[0]-p[0])*t);py.push(p[1]+(q[1]-p[1])*t)}
  let s0=0,bd=1e9;for(let i=0;i<N;i++){const d=Math.hypot(px[i]-640,py[i]-875);if(d<bd){bd=d;s0=i}}
  TX=new Float32Array(N);TY=new Float32Array(N);TA=new Float32Array(N);NX=new Float32Array(N);NY=new Float32Array(N);KS=new Float32Array(N);
  for(let i=0;i<N;i++){TX[i]=px[(i+s0)%N];TY[i]=py[(i+s0)%N]}
  for(let i=0;i<N;i++){const a=(i+N-1)%N,b=(i+1)%N;TA[i]=Math.atan2(TY[b]-TY[a],TX[b]-TX[a]);NX[i]=-Math.sin(TA[i]);NY[i]=Math.cos(TA[i])}
  const k0=new Float32Array(N);for(let i=0;i<N;i++)k0[i]=wrapA(TA[(i+1)%N]-TA[(i+N-1)%N])/(2*st);
  for(let i=0;i<N;i++){let s=0;for(let j=-5;j<=5;j++)s+=k0[(i+j+N)%N];KS[i]=s/11}
  for(let i=0;i<N;i+=7){const k=KS[i];if(Math.abs(k)<.0042)continue;const sg=k>0?-1:1,o=HW+KERB+14,x=TX[i]+NX[i]*sg*o,y=TY[i]+NY[i]*sg*o;let ok=true;
    for(let j=0;j<N;j+=2)if(Math.hypot(TX[j]-x,TY[j]-y)<HW+KERB+11){ok=false;break}
    if(ok){bumpers.push([x,y]);solids.push([x,y,8,1,1])}}
  const str=(lo,hi,ex)=>{let bi=0,bv=1e9;for(let i=lo|0;i<hi;i++){if(ex>=0&&Math.abs(i-ex)<N*.2)continue;let m=0;for(let j=-16;j<=16;j++)m=Math.max(m,Math.abs(KS[(i+j+N)%N]));if(m<bv){bv=m;bi=i}}return bi};
  const pa=str(N*.12,N*.85,-1);pads=[[pa,-16],[str(N*.12,N*.85,pa),16]];const go=HW+KERB+8;GA=[TX[0]-NX[0]*go,TY[0]-NY[0]*go,TX[0]+NX[0]*go,TY[0]+NY[0]*go];solids.push([GA[0],GA[1],4,0,0],[GA[2],GA[3],4,0,0]);
}
const G1=pack(78,176,64),G2=pack(68,164,56),G1L=pack(104,196,84),G2D=pack(58,150,50),GAVG=pack(73,170,60);
function grassCol(x,y){const s=Math.floor((x+y)/64)&1,h=hash(x>>1,y>>1)%53;return h===0?G1L:h===1?G2D:s?G1:G2}
const SANDS=[[945,140,78,70],[978,545,62,80],[72,792,88,80],[50,640,52,62]],LAKE=[560,652,150,92];
function blob(g,cx,cy,rx,ry,ph,gr=0){g.beginPath();for(let i=0;i<=72;i++){const a=i/72*TAU,r=1+.13*Math.sin(3*a+ph)+.08*Math.sin(5*a+ph*2.3)+.04*Math.sin(9*a+ph);g.lineTo(cx+Math.cos(a)*(rx*r+gr),cy+Math.sin(a)*(ry*r+gr))}g.closePath()}
function trackPath(g){g.beginPath();for(let i=0;i<N;i++)g.lineTo(TX[i],TY[i]);g.closePath()}
function gridSlot(s){const back=32+s*44,i=(N-Math.round(back/SPC))%N,l=s%2?18:-18;return[TX[i]+NX[i]*l,TY[i]+NY[i]*l,TA[i],i]}
function buildMap(){
  const c=mk(MS,MS),g=c.getContext('2d',{willReadFrequently:true});
  let im=g.createImageData(MS,MS),d=new Uint32Array(im.data.buffer);
  for(let y=0,i=0;y<MS;y++)for(let x=0;x<MS;x++)d[i++]=grassCol(x,y);
  g.putImageData(im,0,0);
  for(let i=0;i<300;i++){const x=rnd()*MS,y=rnd()*MS;g.fillStyle=['#fff6d8','#ffd84a','#ff9ec4'][i%3];for(let k=0;k<3;k++)g.fillRect(x+rnd()*12|0,y+rnd()*12|0,2,2)}
  // physics mask: R=road G=kerb R+G=sand B=water
  const mc=mk(MS,MS),mg=mc.getContext('2d',{willReadFrequently:true});mg.fillStyle='#000';mg.fillRect(0,0,MS,MS);
  SANDS.forEach((s,i)=>{blob(g,s[0],s[1],s[2],s[3],i*1.7,3);g.fillStyle='#d3bd7e';g.fill();blob(g,s[0],s[1],s[2],s[3],i*1.7);g.fillStyle='#ead9a4';g.fill();blob(mg,s[0],s[1],s[2],s[3],i*1.7);mg.fillStyle='#ff0';mg.fill()});
  blob(g,...LAKE,.6,11);g.fillStyle='#d3bd7e';g.fill();blob(g,...LAKE,.6,8);g.fillStyle='#ecdcaa';g.fill();
  blob(mg,...LAKE,.6,8);mg.fillStyle='#ff0';mg.fill();blob(mg,...LAKE,.6);mg.fillStyle='#00f';mg.fill();
  blob(g,...LAKE,.6);const wg=g.createLinearGradient(0,560,0,750);wg.addColorStop(0,'#46a8ee');wg.addColorStop(1,'#1f6fd4');g.fillStyle=wg;g.fill();
  g.save();g.clip();g.strokeStyle='#8fd0f8';g.lineWidth=2;for(let i=0;i<46;i++){const x=420+rnd()*280,y=570+rnd()*165,w=8+rnd()*26;g.globalAlpha=.35+rnd()*.5;g.beginPath();g.moveTo(x,y);g.lineTo(x+w,y);g.stroke()}g.restore();
  blob(g,...LAKE,.6);g.strokeStyle='#bfe6fb';g.lineWidth=3;g.stroke();
  // bushes
  for(let n=0,t=0;n<150&&t<4000;t++){const x=20+rnd()*984,y=20+rnd()*984,r=8+rnd()*9;let ok=!(x>410&&x<790&&y>918);
    if(ok&&((x-LAKE[0])/(LAKE[2]+40))**2+((y-LAKE[1])/(LAKE[3]+40))**2<1)ok=false;
    if(ok)for(const s of SANDS)if(((x-s[0])/(s[2]+r))**2+((y-s[1])/(s[3]+r))**2<1){ok=false;break}
    if(ok)for(let j=0;j<N;j+=2)if(Math.hypot(TX[j]-x,TY[j]-y)<HW+KERB+r+22){ok=false;break}
    if(!ok)continue;n++;
    if(n%3===0){solids.push([x,y,5,0,.85+rnd()*.5]);g.fillStyle='rgba(26,80,32,.5)';g.beginPath();g.ellipse(x+6,y+4,14,8,0,0,TAU);g.fill();continue}
    g.fillStyle='#2f7d2c';g.beginPath();g.arc(x,y,r+2.5,0,TAU);g.fill();
    const bg=g.createRadialGradient(x-r*.3,y-r*.3,r*.1,x,y,r);bg.addColorStop(0,'#a6dc5c');bg.addColorStop(.55,'#5fb03a');bg.addColorStop(1,'#3d8f30');g.fillStyle=bg;g.beginPath();g.arc(x,y,r,0,TAU);g.fill()}
  // road
  g.lineJoin=mg.lineJoin='round';
  trackPath(g);g.strokeStyle='rgba(30,84,34,.4)';g.lineWidth=(HW+KERB)*2+12;g.stroke();
  g.strokeStyle='#f5f1e6';g.lineWidth=(HW+KERB)*2;g.stroke();
  g.setLineDash([18,18]);g.strokeStyle='#e3442e';g.stroke();g.setLineDash([]);
  g.strokeStyle='#6d6e7e';g.lineWidth=HW*2;g.stroke();
  g.strokeStyle='rgba(38,36,52,.13)';g.lineWidth=44;g.stroke();g.lineWidth=22;g.stroke();
  g.setLineDash([18,28]);g.lineDashOffset=30;g.strokeStyle='#ecebf0';g.lineWidth=3.5;g.stroke();g.setLineDash([]);
  trackPath(mg);mg.strokeStyle='#0f0';mg.lineWidth=(HW+KERB)*2;mg.stroke();mg.strokeStyle='#f00';mg.lineWidth=HW*2;mg.stroke();
  // start line + grid
  g.save();g.translate(TX[0],TY[0]);g.rotate(TA[0]);const cq=HW/6;g.fillStyle='#6d6e7e';g.fillRect(-14,-HW,26,HW*2);
  for(let i=0;i<3;i++)for(let j=0;j<12;j++){g.fillStyle=(i+j)&1?'#22202a':'#f6f4ee';g.fillRect(-cq*1.5+i*cq,-HW+j*cq,cq+.3,cq+.3)}g.restore();
  for(const pd of pads){g.save();g.translate(TX[pd[0]]+NX[pd[0]]*pd[1],TY[pd[0]]+NY[pd[0]]*pd[1]);g.rotate(TA[pd[0]]);g.fillStyle='#262433';g.fillRect(-22,-15,44,30);
    for(let k=0;k<3;k++){const x0=-18+k*13;g.fillStyle=k&1?'#ff8a1f':'#ffd23a';g.beginPath();g.moveTo(x0,-12);g.lineTo(x0+8,0);g.lineTo(x0,12);g.lineTo(x0+6,12);g.lineTo(x0+14,0);g.lineTo(x0+6,-12);g.fill()}g.restore()}
  g.strokeStyle='#f1f0f4';g.lineWidth=2.5;g.lineJoin='miter';
  for(let s=0;s<6;s++){const p=gridSlot(s);g.save();g.translate(p[0],p[1]);g.rotate(p[2]);g.beginPath();g.moveTo(2,-15);g.lineTo(24,-15);g.lineTo(24,15);g.lineTo(2,15);g.stroke();g.restore()}
  // bumpers
  for(const b of bumpers){g.fillStyle='rgba(24,74,32,.6)';g.beginPath();g.ellipse(b[0]+3,b[1]+2,11,8,0,0,TAU);g.fill()}
  // grandstand
  g.fillStyle='rgba(24,70,32,.55)';g.fillRect(426,934,356,22);g.fillStyle='#2a2838';g.fillRect(426,933,348,12);const tc=['#3f6fd8','#f08a2a','#f2c53a','#f1e6c8','#d8503a','#3f6fd8','#f1e6c8'];
  for(let i=0;i<152;i++)GS.push(tc[rnd()*tc.length|0]);
  // surface map + speckle
  const md=mg.getImageData(0,0,MS,MS).data;surf=new Uint8Array(MS*MS);
  im=g.getImageData(0,0,MS,MS);d=new Uint32Array(im.data.buffer);const px=im.data;
  for(let i=0,y=0;y<MS;y++)for(let x=0;x<MS;x++,i++){const r=md[i*4],gg=md[i*4+1],b=md[i*4+2];
    const s=r>200&&gg>200?3:r>127?1:gg>127?2:b>127?4:0;surf[i]=s;
    if(s===1||s===3){const o=i*4;if(s===1&&px[o]>150)continue;const h=hash(x>>1,y>>1)&255,dl=s===1?(h<34?-13:h>222?13:(h&7)-3):(h<40?-12:h>230?10:0);px[o]+=dl;px[o+1]+=dl;px[o+2]+=dl}}
  for(const pd of pads)for(let u=-22;u<=22;u++)for(let v=-15;v<=15;v++){const i=pd[0],x=TX[i]+NX[i]*(pd[1]+v)+Math.cos(TA[i])*u|0,y=TY[i]+NY[i]*(pd[1]+v)+Math.sin(TA[i])*u|0;if(surf[y*MS+x]===1)surf[y*MS+x]=5}

buildTrack();buildMap();mkProps();resize();resetRace(true);state='title';pick(0);
document.querySelectorAll('.card').forEach(c=>{let s='';for(let i=0;i<70;i++)s+=' ▘▝▖▗▚▞▀▄▪ '[Math.random()*11|0];c.dataset.p=s});
let rz;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{resize();hud()},120)});
const sim=/sim=([\d.]+)/.exec(location.hash);
if(sim){if(!/title/.test(location.hash)){start();P.ai=true}for(let i=0;i<sim[1]*120;i++)step(1/120);render();hud();document.title=cars.map(c=>KARTS[c.k][0]+':'+c.lap+'/'+fmt(c.best)).join(' ')+' T'+raceT.toFixed(1)+' fin'+fmt(P.fin)}
let last=0,acc=0,hudT=0;
function frame(t){requestAnimationFrame(frame);const dt=Math.min(.05,(t-last)/1000);last=t;if(paused)return;
  acc+=dt;while(acc>=1/120){step(1/120);acc-=1/120}render();engine();hudT+=dt;if(hudT>.08){hudT=0;hud()}}
if(!sim)requestAnimationFrame(frame);
</script>
